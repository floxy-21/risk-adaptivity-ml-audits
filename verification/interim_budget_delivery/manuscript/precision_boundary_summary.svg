  <rect x="863" y="582" width="42" height="25" rx="5" fill="#FFFFFF" stroke="#8BBDB2" stroke-width="1.2" />
  <text x="884" y="601" font-size="18" font-weight="400" fill="#087F83" text-anchor="middle">zₘ</text>
  <text x="936" y="559" font-size="20" font-weight="400" fill="#18313F" text-anchor="start">The first answer selects</text>
  <text x="936" y="588" font-size="20" font-weight="400" fill="#18313F" text-anchor="start">the second reading.</text>
  <text x="714" y="621" font-size="17" font-weight="400" fill="#526773" text-anchor="start">Exact unit-cost coordinates · dimension/dictionary grow with m</text>
  <text x="64" y="690" font-size="21" font-weight="700" fill="#18313F" text-anchor="start">Same two-reading budget. Success is measured on the worst feasible record.</text>
  <text x="64" y="724" font-size="20" font-weight="400" fill="#526773" text-anchor="start">Joint family: 2 fixed readings suffice for each contrast; 3 suffice for joint assurance.</text>
  <text x="64" y="754" font-size="20" font-weight="400" fill="#526773" text-anchor="start">The same separation holds for all 3 pairwise comparisons among 3 models.</text>
  <rect x="64" y="792" width="1312" height="202" rx="16" fill="#FCF7EE" stroke="#E8DDCA" stroke-width="1.2" />
  <text x="94" y="830" font-size="16" font-weight="700" fill="#9A6829" text-anchor="start" letter-spacing="1.2">METER APPLICATION · EXACT INSTANCE CERTIFICATES</text>
  <text x="94" y="902" font-size="54" font-weight="700" fill="#9A6829" text-anchor="start">1 vs 1/2</text>
  <text x="94" y="935" font-size="19" font-weight="400" fill="#18313F" text-anchor="start">adaptive / optimal randomized batch</text>
  <line x1="625" y1="850" x2="625" y2="942" stroke="#DFD0B8" stroke-width="1.5" />
  <text x="821" y="895" font-size="43" font-weight="700" fill="#18313F" text-anchor="middle">165 / 819</text>
  <text x="821" y="930" font-size="20" font-weight="400" fill="#526773" text-anchor="middle">certified original blocks</text>
  <text x="1187" y="895" font-size="43" font-weight="700" fill="#18313F" text-anchor="middle">57 / 279</text>
  <text x="1187" y="930" font-size="20" font-weight="400" fill="#526773" text-anchor="middle">certified external blocks</text>
  <text x="94" y="970" font-size="18" font-weight="400" fill="#526773" text-anchor="start">Declared query model: exact total + noiseless prefixes · two readings · all six model pairs</text>
  <text x="64" y="1027" font-size="18" font-weight="400" fill="#526773" text-anchor="start">Retrospective, instance-specific evidence under declared access rules; no universal deployment gain.</text>
</svg>