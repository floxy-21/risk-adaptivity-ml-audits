<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="summary-title summary-description" font-family="Arial, Helvetica, sans-serif">
  <title id="summary-title">Sharing two readings changes the precision guarantee</title>
  <desc id="summary-description">Visual abstract. For one affine comparison on a compact convex uncertainty set, a deterministic adaptive two-query precision guarantee implies some randomized fixed batch has worst-record success at least one half. In a constructed family with two jointly audited contrasts and m at least three, optimal worst-record success is one for adaptation and exactly one over m for randomized fixed batches. All m plus three coordinates are available as exact unit-cost queries, so dimension and query dictionary grow with m. Each contrast separately needs only two fixed queries; three fixed queries suffice jointly. The separation also covers all three pairwise comparisons among three models. Separately, source-derived meter blocks have verified success one versus one half on 165 of 819 original blocks and 57 of 279 external blocks, under the declared exact-total and noiseless-prefix query model. These are exact instance certificates, not recorded success-rate estimates or a universal deployment-gain claim.</desc>
  <rect x="0" y="0" width="1440" height="1050" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" />
  <text x="64" y="53" font-size="17" font-weight="700" fill="#526773" text-anchor="start" letter-spacing="1.8">PRECISION UNDER A SHARED QUERY BUDGET</text>
  <text x="64" y="111" font-size="46" font-weight="700" fill="#18313F" text-anchor="start">Sharing two readings changes</text>
  <text x="64" y="165" font-size="46" font-weight="700" fill="#18313F" text-anchor="start">the precision guarantee</text>
  <text x="64" y="205" font-size="21" font-weight="400" fill="#526773" text-anchor="start">Affine contrasts · compact convex uncertainty · finite dictionary of exact scalar queries</text>
  <rect x="64" y="238" width="596" height="408" rx="16" fill="#F3F6F9" stroke="#DCE4EA" stroke-width="1.2" />
  <rect x="684" y="238" width="692" height="408" rx="16" fill="#EFF8F6" stroke="#CFE4DE" stroke-width="1.2" />
  <text x="94" y="276" font-size="16" font-weight="700" fill="#315A79" text-anchor="start" letter-spacing="1.4">GENERAL GUARANTEE</text>
  <text x="94" y="321" font-size="31" font-weight="700" fill="#18313F" text-anchor="start">One comparison</text>
  <text x="201" y="414" font-size="72" font-weight="700" fill="#315A79" text-anchor="middle">1</text>
  <line x1="295" y1="390" x2="369" y2="390" stroke="#315A79" stroke-width="2" />
  <path d="M 363 384 L 370 390 L 363 396" fill="none" stroke="#315A79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="493" y="414" font-size="66" font-weight="700" fill="#315A79" text-anchor="middle">≥ 1/2</text>
  <text x="201" y="452" font-size="21" font-weight="400" fill="#18313F" text-anchor="middle">adaptive</text>
  <text x="201" y="481" font-size="21" font-weight="400" fill="#18313F" text-anchor="middle">guarantee</text>
  <text x="493" y="452" font-size="21" font-weight="400" fill="#18313F" text-anchor="middle">randomized fixed</text>
  <text x="493" y="481" font-size="21" font-weight="400" fill="#18313F" text-anchor="middle">batch guarantee</text>
  <line x1="94" y1="517" x2="630" y2="517" stroke="#D4DFE6" stroke-width="1.5" />
  <text x="94" y="552" font-size="21" font-weight="400" fill="#18313F" text-anchor="start">If two adaptive readings ensure precision,</text>
  <text x="94" y="583" font-size="21" font-weight="400" fill="#18313F" text-anchor="start">a randomized batch retains a half-success floor.</text>
  <text x="94" y="621" font-size="17" font-weight="400" fill="#526773" text-anchor="start">Premise: deterministic adaptive policy</text>
  <text x="714" y="276" font-size="16" font-weight="700" fill="#087F83" text-anchor="start" letter-spacing="1.2">CONSTRUCTED FAMILY · m ≥ 3</text>
  <text x="714" y="321" font-size="31" font-weight="700" fill="#18313F" text-anchor="start">Two contrasts audited jointly</text>
  <text x="714" y="348" font-size="17" font-weight="400" fill="#526773" text-anchor="start">Success = halve both sharp interval widths</text>
  <text x="848" y="414" font-size="72" font-weight="700" fill="#087F83" text-anchor="middle">1</text>
  <text x="1026" y="396" font-size="23" font-weight="400" fill="#526773" text-anchor="middle">vs</text>
  <text x="1198" y="414" font-size="72" font-weight="700" fill="#087F83" text-anchor="middle">1/m</text>
  <text x="848" y="452" font-size="21" font-weight="400" fill="#18313F" text-anchor="middle">adaptive</text>
  <text x="848" y="481" font-size="21" font-weight="400" fill="#18313F" text-anchor="middle">success</text>
  <text x="1198" y="452" font-size="21" font-weight="400" fill="#18313F" text-anchor="middle">optimal randomized</text>
  <text x="1198" y="481" font-size="21" font-weight="400" fill="#18313F" text-anchor="middle">fixed batch</text>
